<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060B18">
  <title>Paiement confirmé — Skyloop</title>
  <link rel="icon" type="image/png" href="assets/images/logoskyloop.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main style="min-height: 100vh; display: flex; align-items: center; padding: 80px 0;">
    <div class="container">
      <div style="max-width: 520px; margin: 0 auto; text-align: center;">
        <div style="width: 88px; height: 88px; margin: 0 auto 32px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-glow); animation: floaty 3s ease-in-out infinite;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>

        <h1>Paiement <span class="gradient">confirmé</span> ✨</h1>
        <p style="font-size: 1.05rem;">
          Merci pour votre confiance ! Votre paiement a été reçu avec succès.
          Vous allez recevoir un email de confirmation et nous vous contactons dans la journée
          pour démarrer votre projet.
        </p>

        <a href="index.html" class="btn btn--primary btn--lg" style="margin-top: 24px;">Retour à l'accueil</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
