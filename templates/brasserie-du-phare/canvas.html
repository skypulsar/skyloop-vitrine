<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brasserie du Phare — Site vitrine</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@300;400;500;600&family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="brewery.css" />

  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; background: #f0eee9; }
    body { font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }

    /* Tweak-driven palettes */
    .bp-site[data-palette="maritime"] {
      --bp-paper: #f5ecd6; --bp-paper-deep: #ecdfba; --bp-cream: #fbf4df;
      --bp-ink: #1b3a3a; --bp-ink-soft: #3a4f4f;
      --bp-teal: #1a5d5d; --bp-teal-bright: #2e8c8c; --bp-teal-soft: #a8cdc8;
      --bp-wood: #8a5a2b; --bp-wood-light: #c9a878;
    }
    .bp-site[data-palette="sunset"] {
      --bp-paper: #f7ecd9; --bp-paper-deep: #f0d9b8; --bp-cream: #fdf4e0;
      --bp-ink: #3a1f12; --bp-ink-soft: #5e3622;
      --bp-teal: #c75147; --bp-teal-bright: #d97c41; --bp-teal-soft: #f0c7a8;
      --bp-wood: #a85a2b; --bp-wood-light: #d49c5a;
    }
    .bp-site[data-palette="marine"] {
      --bp-paper: #eef2f5; --bp-paper-deep: #d8e1e9; --bp-cream: #f8fafc;
      --bp-ink: #0f2747; --bp-ink-soft: #2c4869;
      --bp-teal: #2c5a91; --bp-teal-bright: #4a82c2; --bp-teal-soft: #b0c8e0;
      --bp-wood: #6b4a2b; --bp-wood-light: #9b8161;
    }
    .bp-site[data-palette="charcoal"] {
      --bp-paper: #f1ece0; --bp-paper-deep: #e3dcc9; --bp-cream: #faf6ea;
      --bp-ink: #1f1d1a; --bp-ink-soft: #4a4640;
      --bp-teal: #2a2825; --bp-teal-bright: #5b5852; --bp-teal-soft: #c4bda9;
      --bp-wood: #a5713a; --bp-wood-light: #d3b078;
    }

    /* Display fonts */
    .bp-site[data-display="serif"]      { --bp-font-display: 'DM Serif Display', Georgia, serif; }
    .bp-site[data-display="cormorant"]  { --bp-font-display: 'Cormorant Garamond', Georgia, serif; }
    .bp-site[data-display="playfair"]   { --bp-font-display: 'Playfair Display', Georgia, serif; }

    /* Stamp toggle */
    .bp-site[data-stamp="false"] .bp-hero-stamp { display: none; }

    /* Density */
    .bp-site[data-density="compact"] .bp-section { padding-top: 64px; padding-bottom: 64px; }
    .bp-site[data-density="compact"] .bp-hero { padding-top: 40px; padding-bottom: 64px; }
    .bp-site[data-density="compact"] .bp-story { padding: 64px 32px; }

    /* Photo filter — adds a warm wash like Polaroid */
    .bp-site[data-photo="warm"] .bp-hero-visual img,
    .bp-site[data-photo="warm"] .bp-story-img img,
    .bp-site[data-photo="warm"] .bp-about-grid img,
    .bp-site[data-photo="warm"] .bp-featured-img img,
    .bp-site[data-photo="warm"] .bp-brewer img {
      filter: sepia(0.18) saturate(1.05) contrast(0.95) brightness(1.02);
    }

    /* App canvas root */
    #canvas-root { width: 100vw; height: 100vh; }

    /* Layout for the canvas frames */
    .frame-stack {
      display: flex; gap: 56px; align-items: flex-start;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Frame + canvas + tweaks starter components -->
  <script type="text/babel" src="components/browser-window.jsx"></script>
  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/design-canvas.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>

  <!-- Data + brewery components -->
  <script type="text/babel" src="components/brewery-data.jsx"></script>
  <script type="text/babel" src="components/brewery-pages.jsx"></script>
  <script type="text/babel" src="components/brewery-shop.jsx"></script>
  <script type="text/babel" src="components/brewery-app.jsx"></script>

  <!-- Main App -->
  <script type="text/babel">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "palette": "maritime",
      "display": "playfair",
      "stamp": true,
      "density": "regular",
      "photo": "warm",
      "paletteSwatch": [
        "#1a5d5d",
        "#f5ecd6",
        "#8a5a2b"
      ]
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply tweaks as data-attrs on each BrewerySite instance
      const tweakProps = {
        "data-palette": t.palette,
        "data-display": t.display,
        "data-stamp":   String(t.stamp),
        "data-density": t.density,
        "data-photo":   t.photo,
      };

      // The BrewerySite root applies className="bp-site"; we wrap it with these
      // data-attrs by passing them via a wrapper div.
      return (
        <div>
          <DesignCanvas>
            <DCSection
              id="site"
              title="Brasserie du Phare — Site vitrine & boutique"
              subtitle="Site complet : accueil, gamme, fiches produit, panier, checkout. Affichage desktop + mobile, à comparer côte à côte. Naviguez librement dans chaque artboard.">
              <DCArtboard id="desktop" label="Desktop · 1280 × 820" width={1280} height={820}>
                <SiteFrame mode="desktop" tweakProps={tweakProps} />
              </DCArtboard>
              <DCArtboard id="mobile" label="Mobile · iPhone 15 Pro" width={402} height={874}>
                <SiteFrame mode="mobile" tweakProps={tweakProps} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Palette" />
            <TweakColor  label="Ambiance" value={t.paletteSwatch || []}
                         options={[
                           ['#1a5d5d', '#f5ecd6', '#8a5a2b'],
                           ['#c75147', '#f7ecd9', '#d97c41'],
                           ['#2c5a91', '#eef2f5', '#6b4a2b'],
                           ['#1f1d1a', '#f1ece0', '#a5713a'],
                         ]}
                         onChange={(arr) => {
                           // map back to palette name
                           const map = {
                             '#1a5d5d': 'maritime',
                             '#c75147': 'sunset',
                             '#2c5a91': 'marine',
                             '#1f1d1a': 'charcoal',
                           };
                           setTweak({ palette: map[arr[0]] || 'maritime', paletteSwatch: arr });
                         }} />

            <TweakSection label="Typographie" />
            <TweakRadio  label="Titres affiche" value={t.display}
                         options={[
                           { value: 'serif',     label: 'DM Serif' },
                           { value: 'cormorant', label: 'Cormorant' },
                           { value: 'playfair',  label: 'Playfair' },
                         ]}
                         onChange={(v) => setTweak('display', v)} />

            <TweakSection label="Mise en page" />
            <TweakRadio  label="Densité" value={t.density}
                         options={['regular', 'compact']}
                         onChange={(v) => setTweak('density', v)} />
            <TweakToggle label="Tampon « Depuis 2019 »" value={t.stamp}
                         onChange={(v) => setTweak('stamp', v)} />
            <TweakRadio  label="Photos" value={t.photo}
                         options={[
                           { value: 'natural', label: 'Naturel' },
                           { value: 'warm',    label: 'Chaud' },
                         ]}
                         onChange={(v) => setTweak('photo', v)} />
          </TweaksPanel>
        </div>
      );
    }

    // Wraps a BrewerySite inside the appropriate device frame, applying
    // tweak data-attrs to the .bp-site root via a wrapper.
    function SiteFrame({ mode, tweakProps }) {
      if (mode === 'desktop') {
        return (
          <ChromeWindow
            tabs={[{ title: 'Brasserie du Phare — Brassée en bord de mer' }]}
            url="brasserieduphare.fr"
            width={1280} height={820}>
            <div style={{ width: '100%', height: '100%' }} {...tweakProps}
                 ref={(el) => { if (el) { /* applied via wrapper ../ */ } }}>
              {/* The site itself: pass mode and let it render */}
              <SiteRoot mode="desktop" tweakProps={tweakProps} />
            </div>
          </ChromeWindow>
        );
      }
      return (
        <IOSDevice width={402} height={874} dark={false}>
          <SiteRoot mode="mobile" tweakProps={tweakProps} />
        </IOSDevice>
      );
    }

    // Renders the BrewerySite, applying tweak data-attrs directly on the root.
    // (BrewerySite already adds .bp-site className; we attach tweak attrs via a
    // useEffect on its container.)
    function SiteRoot({ mode, tweakProps }) {
      const ref = React.useRef(null);
      React.useEffect(() => {
        if (!ref.current) return;
        const root = ref.current.querySelector('.bp-site');
        if (!root) return;
        Object.entries(tweakProps).forEach(([k, v]) => root.setAttribute(k, v));
      }, [tweakProps]);
      return (
        <div ref={ref} style={{ width: '100%', height: '100%' }}>
          <BrewerySite mode={mode} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
