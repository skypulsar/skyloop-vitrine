<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brasserie du Phare — Brassée en bord de mer, Cany-Barville</title>
  <meta name="description" content="Brasserie artisanale à Cany-Barville sur la Côte d'Albâtre. Bières brassées en bord de mer, boutique en ligne, visites et événements." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Brasserie du Phare — Brassée en bord de mer" />
  <meta property="og:description" content="Bières artisanales brassées à Cany-Barville, Côte d'Albâtre." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@300;400;500;600&family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="brewery.css" />

  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; background: #f0eee9; }
    body { font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }

    /* Palettes (driven by data-palette on .bp-site) */
    .bp-site[data-palette="maritime"] {
      --bp-paper: #f5ecd6; --bp-paper-deep: #ecdfba; --bp-cream: #fbf4df;
      --bp-ink: #1b3a3a; --bp-ink-soft: #3a4f4f;
      --bp-teal: #1a5d5d; --bp-teal-bright: #2e8c8c; --bp-teal-soft: #a8cdc8;
      --bp-wood: #8a5a2b; --bp-wood-light: #c9a878;
    }
    .bp-site[data-palette="sunset"] {
      --bp-paper: #f7ecd9; --bp-paper-deep: #f0d9b8; --bp-cream: #fdf4e0;
      --bp-ink: #3a1f12; --bp-ink-soft: #5e3622;
      --bp-teal: #c75147; --bp-teal-bright: #d97c41; --bp-teal-soft: #f0c7a8;
      --bp-wood: #a85a2b; --bp-wood-light: #d49c5a;
    }
    .bp-site[data-palette="marine"] {
      --bp-paper: #eef2f5; --bp-paper-deep: #d8e1e9; --bp-cream: #f8fafc;
      --bp-ink: #0f2747; --bp-ink-soft: #2c4869;
      --bp-teal: #2c5a91; --bp-teal-bright: #4a82c2; --bp-teal-soft: #b0c8e0;
      --bp-wood: #6b4a2b; --bp-wood-light: #9b8161;
    }
    .bp-site[data-palette="charcoal"] {
      --bp-paper: #f1ece0; --bp-paper-deep: #e3dcc9; --bp-cream: #faf6ea;
      --bp-ink: #1f1d1a; --bp-ink-soft: #4a4640;
      --bp-teal: #2a2825; --bp-teal-bright: #5b5852; --bp-teal-soft: #c4bda9;
      --bp-wood: #a5713a; --bp-wood-light: #d3b078;
    }

    /* Display fonts */
    .bp-site[data-display="serif"]      { --bp-font-display: 'DM Serif Display', Georgia, serif; }
    .bp-site[data-display="cormorant"]  { --bp-font-display: 'Cormorant Garamond', Georgia, serif; }
    .bp-site[data-display="playfair"]   { --bp-font-display: 'Playfair Display', Georgia, serif; }

    /* Stamp toggle */
    .bp-site[data-stamp="false"] .bp-hero-stamp { display: none; }

    /* Density */
    .bp-site[data-density="compact"] .bp-section { padding-top: 64px; padding-bottom: 64px; }
    .bp-site[data-density="compact"] .bp-hero { padding-top: 40px; padding-bottom: 64px; }
    .bp-site[data-density="compact"] .bp-story { padding: 64px 32px; }

    /* Photo filter — warm wash */
    .bp-site[data-photo="warm"] .bp-hero-visual img,
    .bp-site[data-photo="warm"] .bp-story-img img,
    .bp-site[data-photo="warm"] .bp-about-grid img,
    .bp-site[data-photo="warm"] .bp-featured-img img,
    .bp-site[data-photo="warm"] .bp-brewer img {
      filter: sepia(0.18) saturate(1.05) contrast(0.95) brightness(1.02);
    }

    /* Full-screen site root */
    #root { width: 100%; }
    #root > div { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Site components (no design-canvas chrome) -->
  <script type="text/babel" src="components/brewery-data.jsx"></script>
  <script type="text/babel" src="components/brewery-pages.jsx"></script>
  <script type="text/babel" src="components/brewery-shop.jsx"></script>
  <script type="text/babel" src="components/brewery-app.jsx"></script>

  <!-- Full-screen mount: the real site, responsive (desktop / mobile via data-mode) -->
  <script type="text/babel">
    function FullSite() {
      const getMode = () => (window.innerWidth < 768 ? "mobile" : "desktop");
      const [mode, setMode] = React.useState(getMode());

      React.useEffect(() => {
        let raf = null;
        const onResize = () => {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            const m = getMode();
            setMode(prev => (prev !== m ? m : prev));
          });
        };
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);

      // Apply the same default style tweaks the design canvas used,
      // so the site renders identically (palette maritime, Playfair, warm photos).
      React.useEffect(() => {
        const root = document.querySelector(".bp-site");
        if (!root) return;
        root.setAttribute("data-palette", "maritime");
        root.setAttribute("data-display", "playfair");
        root.setAttribute("data-stamp", "true");
        root.setAttribute("data-density", "regular");
        root.setAttribute("data-photo", "warm");
      });

      return <BrewerySite mode={mode} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<FullSite />);
  </script>
</body>
</html>
